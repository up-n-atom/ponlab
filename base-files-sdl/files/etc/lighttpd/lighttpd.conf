# lighttpd configuration file
#
## modules to load
# all other module should only be loaded if really neccesary
# - saves some time
# - saves memory
server.modules = (
	"mod_redirect",
	"mod_alias",
	"mod_cookie_auth",
	"mod_csrf",
	"mod_setenv",
	"mod_proxy",
	"mod_cgi",
	"mod_compress",
	"mod_openssl"
)

include "vendor_path.conf"

# force use of the "write" backend (closes: #2401)
server.network-backend = "write"

## a static document-root, for virtual-hosting take look at the
## server.virtual-* options
server.document-root = var.VendorPath+"/www/"

alias.url += ( "/cgi-bin/" => "/www/cgi-bin/" )
alias.url += ( "/luci-static/" => "/www/luci-static/" )

## where to send error-messages to
#server.errorlog = "/var/log/lighttpd/error.log"

## files to check for if .../ is requested
index-file.names = ( "index.html", "default.html", "index.htm", "default.htm" )

$HTTP["scheme"] == "http" {
    # capture vhost name with regex conditiona -> %0 in redirect pattern
        # must be the most inner block to the redirect rule
            $HTTP["host"] =~ ".*" {
                    url.redirect = (".*" => "https://%0$0")
            }
}

## mimetype mapping
mimetype.assign = (
	".pdf"   => "application/pdf",
	".class" => "application/octet-stream",
	".pac"   => "application/x-ns-proxy-autoconfig",
	".swf"   => "application/x-shockwave-flash",
	".json"   => "application/json",
	".wav"   => "audio/x-wav",
	".gif"   => "image/gif",
	".jpg"   => "image/jpeg",
	".jpeg"  => "image/jpeg",
	".png"   => "image/png",
	".svg"   => "image/svg+xml",
	".css"   => "text/css;charset=UTF-8",
	".html"  => "text/html;charset=UTF-8",
	".htm"   => "text/html;charset=UTF-8",
	".js"    => "text/javascript;charset=UTF-8",
	".txt"   => "text/plain;charset=UTF-8",
	".dtd"   => "text/xml;charset=UTF-8",
	".xml"   => "text/xml;charset=UTF-8"
 )

## Use the "Content-Type" extended attribute to obtain mime type if possible
#mimetypes.use-xattr = "enable"

## send a different Server: header
server.tag = "Unknown-Webserver/1.0"

$HTTP["url"] =~ "\.pdf$" {
	server.range-requests = "disable"
}

##
# which extensions should not be handle via static-file transfer
#
# .php, .pl, .fcgi are most often handled by mod_fastcgi or mod_cgi
static-file.exclude-extensions = ( ".php", ".pl", ".fcgi" )

######### Options that are good to be but not neccesary to be changed #######

## bind to port (default: 80)
#server.port = 81

## bind to localhost (default: all interfaces)
#server.bind = "localhost"

## Enable Ipv6
server.bind = "[::]"
server.set-v6only = "disable"

## error-handler for status 404
#server.error-handler-404 = "/error-handler.php"

## to help the rc.scripts
server.pid-file = "/var/run/lighttpd.pid"

#cgi-bin
$HTTP["remoteip"] =~ "127.0.0.1" {
        alias.url += (
                "/doc/" => "/usr/share/doc/",
                "/images/" => "/usr/share/images/"
        )
        $HTTP["url"] =~ "^/doc/|^/images/" {
                dir-listing.activate = "enable"
        }
        $HTTP["url"] =~ "/cgi-bin/" {
                cgi.assign = ( "" => "" )
        }
        cgi.assign      = (
                ".cgi"  => ""
        )

}

$HTTP["url"] =~ "^/cgi-bin/" {
        cgi.assign = ( "" => "" )
}

$HTTP["url"] =~ "^/cgi/" {
        cgi.assign = ( "" => "" )
}

cgi.assign      = (
        ".cgi"  => ""
)

#cookie_auth.user = "/opt/intel/etc/usermgmt/lighttpd.user"
cookie_auth.session-timeout = 300
cookie_auth.debug = "disable"

$HTTP["url"] =~ "^/cgi/(.+)" {
	csrf.activate = "enable"
	csrf.protect = "enable"
}
csrf.require-user = "enable"
csrf.debug = "disable"
csrf.hash = "sha256"
csrf.header = "X-Csrf-Token"
csrf.ttl = 600

$HTTP["url"] =~ "^/wsd" {
	setenv.add-request-header   = ( "Connection" => "Upgrade")
	setenv.add-response-header  = ( "Connection" => "Upgrade")
	proxy.server = ( "" => ( ( "host" => "127.0.0.1", "port" => "5001" ) ) )
	proxy.header = ( "upgrade" => "enable" )
	proxy.forwarded = ( "for"          => 1,
                        "proto"        => 1,
                        #"host"        => 1,
                        #"by"          => 1,
                        "remote_user" => 1
	)
}

####compress module
compress.allowed-encodings = ("bzip2", "gzip", "deflate")
compress.cache-dir          = "/tmp/cache/lighttpd/compress/"
compress.filetype           = ("text/json","text/plain","text/css", "text/xml", "text/javascript","application/javascript","application/json")


###### virtual hosts
##
##   If you want name-based virtual hosting add the next three settings and load
##   mod_simple_vhost
##
## document-root =
##   virtual-server-root + virtual-server-default-host + virtual-server-docroot or
##   virtual-server-root + http-host + virtual-server-docroot
##
#simple-vhost.server-root = "/home/weigon/wwwroot/servers/"
#simple-vhost.default-host = "grisu.home.kneschke.de"
#simple-vhost.document-root = "/pages/"


##
## Format: <errorfile-prefix><status>.html
## -> ..../status-404.html for 'File not found'
server.errorfile-prefix = var.VendorPath+"/www/error-"

## virtual directory listings
#server.dir-listing = "enable"

## send unhandled HTTP-header headers to error-log
#debug.dump-unknown-headers = "enable"

### only root can use these options
#
# chroot() to directory (default: no chroot() )
#server.chroot = "/"

## change uid to <uid> (default: don't care)
server.username = "lighttpd"
#
server.upload-dirs = ( "/tmp/upgrade" )

## change uid to <uid> (default: don't care)
server.groupname = "lighttpd"

