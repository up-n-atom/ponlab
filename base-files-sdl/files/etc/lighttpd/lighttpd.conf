#### CGI module
#cgi.assign = ( ".pl"  => "/usr/bin/perl", ".cgi" => "/usr/bin/perl" )

ssl.disable-client-renegotiation = "enable"

#### SSL engine
$SERVER["socket"] == ":443" {
server.document-root = var.VendorPath+"/www/"
ssl.engine = "enable"
ssl.openssl.ssl-conf-cmd = ("Protocol" => "-All, TLSv1.2, TLSv1.3")
ssl.pemfile = "/etc/certs/lighttpd/lighttpd.pem"
ssl.honor-cipher-order = "enable"
ssl.cipher-list = "TLS_AES_128_GCM_SHA256:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA384:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES256-CCM8:ECDHE-ECDSA-AES256-CCM:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-CHACHA20-POLY1305:RSA-PSK-CHACHA20-POLY1305:DHE-PSK-CHACHA20-POLY1305:ECDHE-PSK-CHACHA20-POLY1305:PSK-CHACHA20-POLY1305"
ssl.use-sslv2 = "disable"
ssl.use-sslv3 = "disable"
}

#### status module
#status.status-url = "/server-status"
#status.config-url = "/server-config"

#### setenv module
setenv.add-response-header = (
# don't allow external content at all 
"Content-Security-Policy" => "script-src 'self'  'unsafe-eval' 'unsafe-inline' ;",
#don't allow anyone to change the content type
"Content-Type-Options" => "nosniff",
#prevent any communications from being sent over HTTP to the specified domain
"Strict-Transport-Security" => "max-age=31536000;includeSubDomains",
#stop pages from loading when reflected XSS attacks detected
"X-XSS-Protection" => "1;mode=block",
#browser should allow rendering of frame of its in the same origin as the page itself
"X-Frame-Options" => "SAMEORIGIN",
#not to use a previously cached response, not to store the response, the cache must be revalidated on the origin server.
"Cache-Control" => "no-cache,no-store,max-age=0,must-revalidate",
"Pragma" => "no-cache",
"Expires" => "-1"
)
