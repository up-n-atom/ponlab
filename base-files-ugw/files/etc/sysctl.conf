kernel.panic=3
kernel.core_pattern=/tmp/%e.%t.%p.%s.core

net.ipv4.conf.default.arp_ignore=1
net.ipv4.conf.all.arp_ignore=1
net.ipv4.ip_forward=1
net.ipv4.igmp_max_memberships=300
net.ipv4.tcp_fin_timeout=30
net.ipv4.tcp_keepalive_time=120
net.ipv4.tcp_syncookies=1
net.ipv4.tcp_timestamps=1
net.ipv4.tcp_sack=1
net.ipv4.tcp_dsack=1
net.ipv4.route.max_size=4096
net.ipv4.tcp_min_tso_segs=44

net.ipv6.conf.default.forwarding=1
net.ipv6.conf.all.forwarding=1

net.netfilter.nf_conntrack_acct=1
net.netfilter.nf_conntrack_checksum=0
net.netfilter.nf_conntrack_max=16384
net.netfilter.nf_conntrack_tcp_timeout_established=7440
net.netfilter.nf_conntrack_udp_timeout=60
net.netfilter.nf_conntrack_udp_timeout_stream=180
net.netfilter.nf_conntrack_tcp_be_liberal=1
net.netfilter.nf_conntrack_expect_max=100
net.netfilter.nf_conntrack_helper=1

# disable bridge firewalling by default
net.bridge.bridge-nf-call-arptables=0
net.bridge.bridge-nf-call-ip6tables=0
net.bridge.bridge-nf-call-iptables=0

### kernel hardening options ###
# Disable source routing
net.ipv4.conf.default.accept_source_route = 0
net.ipv4.conf.all.accept_source_route = 0

# Do not send ICMP redirect messages
net.ipv4.send_redirects = 0

# Disable ICMP redirect acceptance
net.ipv4.conf.all.accept_redirects = 0

#Ignore ICMP redirect messages
net.inet.icmp.drop_redirect=1

#Ignore Broadcast ICMP ECHO Packets
net.ipv4.icmp_echo_ignore_broadcasts = 1

#Disable Proxy Arp
net.ipv4.conf.all.proxy_arp=0
net.ipv4.conf.default.proxy_arp=0

#Turn on Source Address Verification in all interfaces to prevent some spoofing attacks
net.ipv4.conf.all.rp_filter=1
net.ipv4.conf.default.rp_filter=1

# Ignore bad ICMP errors
net.ipv4.icmp_ignore_bogus_error_responses=1

#Enable TCP SYN cookie protection
net.ipv4.tcp_syncookies = 1

#Enable ECN (Explicit Congestion Notification)
net.ipv4.tcp_ecn=1
