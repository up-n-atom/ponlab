%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/mxl-i2s.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MaxLinear I2S controller

properties:
  compatible:
    oneOf:
      - const: mxl,lgm-i2s

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  clock-names:
    items:
      - const: freq

  power-domains:
    maxItems: 1

  reset-names:
    items:
      - const: i2s

  resets:
    maxItems: 1

  "#sound-dai-cells":
    const: 0

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names
  - resets
  - reset-names
  - "#sound-dai-cells"

additionalProperties: false

examples:
  - |
    i2s@e2700000 {
      compatible = "mxl,lgm-i2s";
      reg = <0xe2700000 0x10000>;
      interrupt-parent = <&ioapic1>;
      interrupts = <114 1>;
      clocks = <&cgu0 LGM_CLK_VIF>;
      clock-names = "freq";
      resets = <&rcu0 0x30 26>;
      reset-names = "i2s";
      power-domains = <&pd_i2s1>;
      #sound-dai-cells = <0>;
    };
