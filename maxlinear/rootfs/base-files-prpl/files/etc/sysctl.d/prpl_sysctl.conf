net.ipv4.route.max_size=4096
net.ipv4.tcp_min_tso_segs=44

net.netfilter.nf_conntrack_tcp_be_liberal=1
net.netfilter.nf_conntrack_expect_max=256
net.netfilter.nf_conntrack_helper=1

# disable bridge firewalling by default
net.bridge.bridge-nf-call-arptables=0
net.bridge.bridge-nf-call-ip6tables=0
net.bridge.bridge-nf-call-iptables=0

### kernel hardening options ###
# Disable source routing
net.ipv4.conf.default.accept_source_route = 0
net.ipv4.conf.all.accept_source_route = 0

# Do not send ICMP redirect messages
net.ipv4.send_redirects = 0

# Disable ICMP redirect acceptance
net.ipv4.conf.all.accept_redirects = 0

#Ignore ICMP redirect messages
net.inet.icmp.drop_redirect=1

#Disable Proxy Arp
net.ipv4.conf.all.proxy_arp=0
net.ipv4.conf.default.proxy_arp=0

#Enable ECN (Explicit Congestion Notification)
net.ipv4.tcp_ecn=0

#Disable auto_flowlabels
net.ipv6.auto_flowlabels=0

# When a primary IP address is removed from this interface
# promote a corresponding secondary IP address instead of
# removing all the corresponding secondary IP addresses.
net.ipv4.conf.all.promote_secondaries=1
net.ipv4.conf.default.promote_secondaries=1

#Enable RFS
net.core.rps_sock_flow_entries=32768


# Increasing socket send buffer and socket receive buffer 
# sizes (from 208KB to 512KB) to address NETLINK message
# drop issue
net.core.rmem_max=524288
net.core.rmem_default=524288
net.core.wmem_max=524288
net.core.wmem_default=524288
